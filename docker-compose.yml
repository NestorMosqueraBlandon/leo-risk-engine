services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LEO_ENVIRONMENT=development
      - LEO_LOG_LEVEL=INFO
      - LEO_DEBUG=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
